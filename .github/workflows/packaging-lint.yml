# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Atelier: pinned to a commit of storytold/craft-common-actions (upstream tracks @main), so a
    # change there runs here only after a sync PR moves the pin. Its inner actions still follow @main.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@f0808a5ccbc32869248193ffab0de98d733de451
