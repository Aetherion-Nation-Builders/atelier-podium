# Throwaway: lives only on a verify/* branch to run the repo's own gate on a sync before its PR is
# merged. Never merged.
name: Verify sync

on:
  push:
    branches: ["verify/**"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libudev-dev libfontconfig1-dev libssl-dev pkg-config cmake nasm clang ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Gate
        shell: bash
        run: |
          # Each part of the repo's own gate (`cargo xtask ci`) on its own, carrying on after a
          # failure so one run reports everything: fmt, clippy (--keep-going), tests
          # (--no-fail-fast), then the xtask checks the repo has.
          fail=0
          step() { echo "===== $*" | tee -a gate.log; if ! "$@" >>gate.log 2>&1; then echo "FAILED STEP: $*" | tee -a gate.log; fail=1; fi; }
          step cargo fmt --all -- --check
          step cargo clippy --workspace --all-targets --keep-going -- -D warnings
          step cargo test --workspace --no-fail-fast
          for x in layers assets wasm parity cleanroom i18n-coverage; do
            if grep -qE "\"$x\"" xtask/src/*.rs 2>/dev/null; then step cargo xtask "$x"; fi
          done
          grep "FAILED STEP" gate.log || true
          exit $fail
      - name: Failing tests
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' gate.log > clean.log || true
          { grep -E "FAILED STEP|^test .* FAILED|^error(\[|:)|panicked at|^failures:|^    [a-z_:0-9]+$|^\s+--> |assertion|left:|right:|✗|violation" clean.log | head -150; echo "----- tail -----"; tail -n 30 clean.log; } > report.txt
          python3 - <<'PY'
          t = open("report.txt", encoding="utf-8", errors="replace").read()
          for i in range(0, min(len(t), 9 * 3000), 3000):
              c = t[i:i + 3000]
              print("::error title=gate report::" + c.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
