# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "crates/fonts/**"
      - .github/workflows/freebsd.yml
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Atelier: pinned to a commit of storytold/craft-common-actions (upstream tracks @main), so a
    # change there runs here only after a sync PR moves the pin. Its inner actions still follow @main.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@f0808a5ccbc32869248193ffab0de98d733de451
    with:
      craft-fonts-ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
